<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI Video Maker</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

.app {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

textarea {
  width: 100%;
  height: 180px;
  padding: 15px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
}

select, button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: none;
  background: #111;
  color: white;
  cursor: pointer;
}

.scene {
  background: #f0f0f0;
  padding: 15px;
  margin-top: 12px;
  border-radius: 12px;
}

.loading {
  margin-top: 20px;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">

<h1>🎬 My AI Video Maker</h1>

<p>Enter your story and choose the video length.</p>

<textarea id="story"
placeholder="Example: Mia finds a tiny blue bird in a magical forest..."></textarea>

<select id="duration">
<option value="1">1 minute</option>
<option value="5">5 minutes</option>
<option value="10">10 minutes</option>
<option value="20">20 minutes</option>
<option value="30">30 minutes</option>
</select>

<button onclick="createScenes()">Create Video Scenes</button>

<div id="loading"></div>

<div id="scenes"></div>

</div>

<script>

function createScenes() {

const story = document.getElementById("story").value;
const duration = Number(document.getElementById("duration").value);

const scenes = document.getElementById("scenes");
const loading = document.getElementById("loading");

if (!story.trim()) {

scenes.innerHTML = "<p>Please enter a story first.</p>";
return;

}

loading.innerHTML = "⏳ Creating your story scenes...";

scenes.innerHTML = "";

let numberOfScenes = duration * 8;

for (let i = 1; i <= numberOfScenes; i++) {

const scene = document.createElement("div");

scene.className = "scene";

scene.innerHTML = `
<strong>Scene ${i}</strong>
<p>${story}</p>
`;

scenes.appendChild(scene);

}

loading.innerHTML =
"✅ " + numberOfScenes +
" scenes prepared for your " +
duration +
"-minute video.";

}

</script>

</body>
</html>
